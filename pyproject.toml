[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "flare-gw"
version = "0.1.0"
description = "FLARE — Fast Learned Approximant & Reduced-order Emulator for gravitational waveforms"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [
    {name = "Connor Bryan"}
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Topic :: Scientific/Engineering :: Physics",
    "Topic :: Scientific/Engineering :: Astronomy",
]

dependencies = [
    "numpy>=1.24.0,<2.0.0",
    "scipy>=1.10.0",
    "pandas>=2.0.0",
    "scikit-learn>=1.2.0",
    "torch>=2.0.0",
    "pycbc>=2.0.0",
    "lalsuite>=7.0",
    "matplotlib>=3.7.0",
    "optuna>=3.0.0",
    "tqdm>=4.64.0",
    "pyyaml>=6.0",
    "requests>=2.28.0",
    "psutil>=5.9.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "pytest-xdist>=3.0.0",
    "black>=23.0.0",
    "isort>=5.0.0",
    "flake8>=6.0.0",
    "mypy>=1.0.0",
]

# Parameter estimation against real GWOSC events (scripts/pe_benchmark.py etc.)
estimator = [
    "gwpy>=3.0.0",
    "gwosc>=0.7.0",
    "emcee>=3.0.0",
    "dynesty>=2.1.0",
    "corner>=2.2.0",
    "h5py>=3.0.0",
    "astropy>=5.0.0",
]

# FastAPI dashboard backend + job orchestration
api = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.29.0",
    "sse-starlette>=2.0.0",
    "python-multipart>=0.0.9",
]

# Claude-driven autonomous architecture search (optional; the runner falls back
# to a local-GGUF server or random search when this isn't installed).
agent = [
    "anthropic>=0.40.0",
]

all = [
    "flare-gw[dev,estimator,api,agent]",
]

[project.scripts]
flare = "src.cli:main"
flare-api = "src.api.launch:main"

[project.urls]
Repository = "https://github.com/Zeos-ctrl/FLARE.git"
Issues = "https://github.com/Zeos-ctrl/FLARE/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
addopts = "-v --tb=short --strict-markers"
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "gpu: marks tests requiring GPU (deselect with '-m \"not gpu\"')",
]

[tool.black]
line-length = 100
target-version = ['py39', 'py310', 'py311']

[tool.isort]
profile = "black"
line_length = 100
skip_gitignore = true

[tool.mypy]
python_version = "3.9"
ignore_missing_imports = true
